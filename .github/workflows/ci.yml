name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.10", "3.11"]

    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CI dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy cryptography matplotlib python-dateutil python-docx PyQt5 pytest pytest-cov

      - name: Verify Python syntax
        shell: bash
        run: |
          python -m compileall \
            acoustic_tracking.py communication.py drone.py dynamic_obstacles.py \
            flying_ledger.py latency_monitor.py leader_follower_logic.py \
            main.py ml_system.py ml_trainer.py swarm_manager.py \
            swarm_mesh.py swarm_formation.py swarm_transport.py swarm_runtime.py \
            mesh_demo.py mesh_simulation.py swarm_tasks.py swarm_identity_store.py \
            swarm_deployment.py swarm_dashboard.py \
            test_dynamic_features.py test_ledger_and_acoustic.py \
            test_swarm_coordination.py test_swarm_identity_store.py \
            test_mesh_simulation.py test_swarm_deployment.py \
            test_swarm_dashboard.py test_swarm_tasks.py test_swarm_scaling.py \
            acoustic_quality.py acoustic_benchmark.py swarm_safety.py quorum_audit.py \
            swarm_model_validation.py \
            test_acoustic_quality.py test_acoustic_benchmark.py test_ledger_integrity.py \
            test_swarm_safety.py test_quorum_audit.py \
            test_swarm_resilience.py test_swarm_model_validation.py \
            tests/gui_smoke_test.py

      - name: Run full coordination and existing regression suites
        shell: bash
        run: |
          pytest -q \
            --junitxml=pytest-results.xml \
            test_dynamic_features.py \
            test_ledger_and_acoustic.py \
            test_swarm_coordination.py \
            test_mesh_simulation.py \
            test_swarm_tasks.py \
            test_swarm_identity_store.py \
            test_swarm_deployment.py \
            test_swarm_dashboard.py \
            test_swarm_scaling.py \
            test_acoustic_quality.py \
            test_acoustic_benchmark.py \
            test_quorum_audit.py \
            test_ledger_integrity.py \
            test_swarm_safety.py \
            test_swarm_resilience.py \
            test_swarm_model_validation.py

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn

  native:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build native targets
        shell: bash
        run: |
          cmake --build build/native --config Release --target drone_controller

      - name: Upload native build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ matrix.os }}
          path: |
            build/native/**/*.dll
            build/native/**/*.lib
            build/native/**/*.exp
            build/native/**/*.so
            build/native/**/*.dylib
            build/native/**/*.a
          if-no-files-found: warn
